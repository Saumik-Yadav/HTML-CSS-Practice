<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Practice</title>
</head>
<body>
    <div style="
        display: grid;
        grid-template-columns: 100px 100px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p></div>
    </div>
    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 100px 100px 200px;">
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>text</p></div>
        <div style="background-color: lightgreen;">div 3</div>
        <div style="background-color: lightpink;">div 4</div>
    </div>
    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 100px 1fr;">
        <div style="background-color: aqua;">div1</div>
        <div style="background-color: bisque;">div2</div>
    </div>
    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 100px 2fr 1fr;">
        <div style="background-color: aqua;">div1</div>
        <div style="background-color: bisque;">div2</div>
        <div style="background-color: blueviolet;">div3</div>
    </div>
    <div style="
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        column-gap: 20px;
        row-gap: 30px;">
        <div style="background-color: aqua;">div1</div>
        <div style="background-color: bisque;">div2</div>
        <div style="background-color: blueviolet;">div3</div>
        <div style="background-color: aqua;">div1</div>
        <div style="background-color: bisque;">div2</div>
        <div style="background-color: blueviolet;">div3</div>
    </div>
</body>
</html>
